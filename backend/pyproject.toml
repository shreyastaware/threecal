[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.5",
    "boto3>=1.42.0",
    "cryptography>=45.0.0",
    "email-validator>=2.2.0",
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "pillow>=12.0.0",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.22",
    "sentry-sdk[fastapi]>=2.71.0",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"

[[tool.mypy.overrides]]
# boto3/botocore ship without type information.
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true
