# Railway config-as-code for the Threecal API service.
# Service settings: root directory = /backend, config file path = /backend/railway.toml.
# Watch patterns are matched against paths from the repo root.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["/backend/**"]

[deploy]
# Uses the Dockerfile CMD: `alembic upgrade head` then uvicorn on $PORT.
# Migrations run in the start command (not preDeployCommand) because volumes are not mounted pre-deploy.
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# SQLite on a volume (volumes cannot have replicas): stop the old instance before the new one starts.
overlapSeconds = 0
drainingSeconds = 30
